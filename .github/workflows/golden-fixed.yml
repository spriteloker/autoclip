name: Golden Fixed Windows Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/golden-build
      - name: Apply reviewed source and set internal version
        run: |
          git apply --whitespace=fix golden-open.patch
          python scripts/bump_version.py 1.5.8
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "feat: golden opening desktop candidate"
          git push origin HEAD:feat/golden-build
      - name: Dispatch official Windows desktop build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run desktop-build.yml --ref feat/golden-build -f build_macos=false -f build_windows=true
