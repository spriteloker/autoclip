name: Golden Fixed Windows Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply reviewed source and set internal version
        run: |
          cp golden-open.patch /tmp/golden-open.patch
          git remote add upstream https://github.com/zhouxiaoka/autoclip.git
          git fetch upstream main
          git reset --hard upstream/main
          git apply --whitespace=fix /tmp/golden-open.patch
          python -c 'from pathlib import Path; import base64; p=Path(".github/workflows/ci.yml"); s=p.read_text(); old=base64.b64decode("ICAgICAgICAgIHN1ZG8gYXB0LWdldCB1cGRhdGUKICAgICAgICAgIHN1ZG8gYXB0LWdldCBpbnN0YWxsIC15IGZmbXBlZyBmb250cy1ub3RvLWNqaw==").decode(); new=base64.b64decode("").decode(); assert old in s; p.write_text(s.replace(old,new))'
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "feat: golden opening desktop candidate"
          git push --force origin HEAD:feat/golden-build
      - name: Dispatch official Windows desktop build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run desktop-build.yml --repo spriteloker/autoclip --ref feat/golden-build -f build_macos=false -f build_windows=true
