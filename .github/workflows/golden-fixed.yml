name: Golden Fixed Windows Build

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply reviewed source and set internal version
        run: |
          cp golden-open.patch /tmp/golden-open.patch
          git remote add upstream https://github.com/zhouxiaoka/autoclip.git
          git fetch upstream main
          git reset --hard upstream/main
          git apply --whitespace=fix /tmp/golden-open.patch
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "feat: golden opening desktop candidate"
          git push --force origin HEAD:feat/golden-build
      - name: Dispatch official Windows desktop build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run desktop-build.yml --ref feat/golden-build -f build_macos=false -f build_windows=true
