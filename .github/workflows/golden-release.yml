name: Publish Golden Opening Pre-release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download 40421795768 -n autoclip-desktop-windows-x64 -D new
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.8-golden.4
          name: AutoClip Golden Opening 1.5.8
          prerelease: true
          body: Windows x64 candidate with contextual golden opening previews and Simplified Chinese output. Source checks passed; local UI acceptance required.
          files: new/**/*.exe
