name: Publish Golden Opening Pre-release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 12679077116
          path: new
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.5.8-golden.1
          name: AutoClip Golden Opening 1.5.8
          prerelease: true
          body: Windows x64 candidate with contextual golden opening previews and Simplified Chinese output. Source checks passed; local UI acceptance required.
          files: new/**/*.exe
